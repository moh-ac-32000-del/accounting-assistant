name: Firestore Rules Tests

on:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Firestore Rules tests
        run: npm run test:rules
