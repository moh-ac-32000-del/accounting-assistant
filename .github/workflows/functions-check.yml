name: Cloud Functions Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"

jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Build functions
        working-directory: functions
        run: npm run build
